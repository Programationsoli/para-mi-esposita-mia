<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para ti ❤️</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: #ffc0cb;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .contenedor {
        text-align: center;
        width: 90%;
        max-width: 450px;
        position: relative;
        z-index: 10;
    }

    .imagen {
        width: 200px;
        height: 200px;
        object-fit: cover;
        border-radius: 15px;
        margin-bottom: 20px;
    }

    h1 {
        font-size: 28px;
        color: #111;
        margin-bottom: 5px;
    }

    #mensajeNo {
        min-height: 25px;
        font-size: 15px;
        font-weight: bold;
        color: #e53935;
        margin-bottom: 20px;
    }

    button {
        border: none;
        color: white;
        font-size: 18px;
        font-weight: bold;
        padding: 14px 30px;
        border-radius: 10px;
        cursor: pointer;
        margin: 8px;
        transition: all 0.3s ease;
    }

    #si {
        background: #16a000;
    }

    #no {
        background: #f00000;
        position: relative;
    }

    #final {
        display: none;
    }

    .mensajeFinal {
        font-size: 21px;
        font-weight: bold;
        color: #e53935;
        line-height: 1.5;
    }

    /* =========================
       CORAZONES
    ========================= */

    .corazon {
        position: fixed;
        top: -20px;
        font-size: 25px;
        animation: caer linear forwards;
        pointer-events: none;
        z-index: 5;
    }

    @keyframes caer {
        to {
            transform: translateY(110vh) rotate(360deg);
            opacity: 0;
        }
    }

    /* =========================
       FUEGOS ARTIFICIALES
    ========================= */

    .fuego {
        position: fixed;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 2;
        box-shadow: 0 0 8px currentColor,
                    0 0 15px currentColor;
        animation: explotar 1.3s ease-out forwards;
    }

    @keyframes explotar {

        0% {
            transform: translate(0, 0) scale(1);
            opacity: 1;
        }

        70% {
            opacity: 1;
        }

        100% {
            transform: translate(var(--x), var(--y)) scale(0.1);
            opacity: 0;
        }
    }

</style>

</head>

<body>

<div class="contenedor" id="pregunta">

    <img
        class="imagen"
        src="oso_con_rosa.gif"
        alt="Osito con rosa"
    >

    <h1>¿Quieres ser mi novia hermosa kawai? ❤️</h1>

    <div id="mensajeNo"></div>

    <button id="si" onclick="aceptar()">
        SÍ ❤️
    </button>

    <button id="no" onclick="presionarNo()">
        NO
    </button>

</div>


<div class="contenedor" id="final">

    <img
        class="imagen"
        src="osito_dando_besos.gif"
        alt="Ositos dando besos"
    >

    <div class="mensajeFinal">
        YAAAAAAAAAAY 🎉❤️<br>
        Te Amo Mucho Mi EspositaMosakawai 💗🥰
    </div>

</div>


<script>

    let contadorNo = 0;

    /* =========================
       BOTÓN NO
    ========================= */

    function presionarNo() {

        contadorNo++;

        const mensaje = document.getElementById("mensajeNo");
        const botonNo = document.getElementById("no");

        const mensajes = [
            "¿Estás segura? 🥺",
            "¿Muy segura? 😭",
            "Te haré muy feliz ❤️",
            "Te haré muy feliz my love 💗"
        ];

        if (contadorNo <= 4) {
            mensaje.innerText = mensajes[contadorNo - 1];
        }

        const tamaños = [18, 15, 12, 9];

        if (contadorNo <= 4) {

            botonNo.style.fontSize =
                tamaños[contadorNo - 1] + "px";

            botonNo.style.padding =
                (14 - contadorNo * 2) + "px " +
                (30 - contadorNo * 4) + "px";
        }

        if (contadorNo === 4) {

            setTimeout(() => {

                botonNo.style.display = "none";

                mensaje.innerText =
                    "Sabía que dirías que sí ❤️";

            }, 500);
        }
    }


    /* =========================
       ACEPTAR
    ========================= */

    function aceptar() {

        document.getElementById("pregunta").style.display = "none";

        document.getElementById("final").style.display = "block";

        // Empiezan los corazones
        setInterval(crearCorazon, 150);

        // Fuegos artificiales inmediatamente
        crearFuegosArtificiales();

        // Nuevos fuegos artificiales cada 3.5 segundos
        setInterval(crearFuegosArtificiales, 3500);
    }


    /* =========================
       CREAR CORAZONES
    ========================= */

    function crearCorazon() {

        const corazon = document.createElement("div");

        corazon.className = "corazon";

        corazon.innerHTML = "❤️";

        corazon.style.left =
            Math.random() * 100 + "vw";

        corazon.style.animationDuration =
            (Math.random() * 3 + 2) + "s";

        document.body.appendChild(corazon);

        setTimeout(() => {
            corazon.remove();
        }, 5000);
    }


    /* =========================
       FUEGOS ARTIFICIALES
    ========================= */

    function crearFuegosArtificiales() {

        const colores = [
            "#ff0000",
            "#ffff00",
            "#00ff00",
            "#00ffff",
            "#ff00ff",
            "#ffffff",
            "#ff8c00",
            "#ff69b4"
        ];

        // Crear varias explosiones
        for (let i = 0; i < 5; i++) {

            setTimeout(() => {

                // Lugar donde explotará
                const centroX =
                    Math.random() * window.innerWidth;

                const centroY =
                    Math.random() *
                    (window.innerHeight * 0.55) + 50;


                // Cantidad de partículas
                for (let j = 0; j < 45; j++) {

                    const chispa =
                        document.createElement("div");

                    chispa.className = "fuego";


                    // Dirección aleatoria
                    const angulo =
                        Math.random() * Math.PI * 2;

                    const distancia =
                        Math.random() * 120 + 40;


                    const x =
                        Math.cos(angulo) * distancia;

                    const y =
                        Math.sin(angulo) * distancia;


                    chispa.style.left =
                        centroX + "px";

                    chispa.style.top =
                        centroY + "px";


                    chispa.style.setProperty(
                        "--x",
                        x + "px"
                    );

                    chispa.style.setProperty(
                        "--y",
                        y + "px"
                    );


                    // Color aleatorio
                    const color =
                        colores[
                            Math.floor(
                                Math.random() *
                                colores.length
                            )
                        ];

                    chispa.style.background =
                        color;

                    chispa.style.color =
                        color;


                    document.body.appendChild(chispa);


                    // Eliminar después de explotar
                    setTimeout(() => {

                        chispa.remove();

                    }, 1300);
                }

            }, i * 500);
        }
    }

</script>

</body>
</html>
